<aside
  class="fixed inset-y-0 left-0 z-40 flex h-screen w-64 shrink-0 flex-col border-r border-slate-800/70 bg-slate-950 px-3 py-4 transition-transform duration-200 ease-in-out lg:sticky lg:top-0 lg:translate-x-0"
  [class.translate-x-0]="open()"
  [class.-translate-x-full]="!open()"
>
  <div class="flex items-center gap-2 px-2 pb-4">
    <div
      class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500 text-sm font-bold text-white"
    >
      LL
    </div>
    <span class="text-[15px] font-semibold tracking-tight text-slate-50">LeagueLens</span>
  </div>

  <div class="px-2 pb-4">
    <p class="mb-1.5 px-1 text-[11px] font-medium tracking-wide text-slate-500 uppercase">
      League
    </p>
    <button
      type="button"
      class="flex w-full items-center justify-between rounded-lg border border-slate-800 bg-slate-900 px-3 py-2 text-left text-sm text-slate-200 transition-colors hover:border-slate-700 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
      aria-label="Switch league (coming soon)"
    >
      <span class="truncate">The Commissioner's&hellip;</span>
      <app-icon name="chevron-down" class="h-4 w-4 text-slate-500" />
    </button>
  </div>

  <nav
    class="flex-1 space-y-0.5 overflow-y-auto px-2"
    aria-label="Primary"
    (click)="navigated.emit()"
  >
    @for (item of navItems; track item.label) {
      @if (item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-500/10 text-indigo-400"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800/60 hover:text-slate-100 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
        >
          <app-icon [name]="item.icon" class="h-[18px] w-[18px]" />
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <button
          type="button"
          disabled
          class="flex w-full cursor-not-allowed items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600"
        >
          <app-icon [name]="item.icon" class="h-[18px] w-[18px]" />
          <span class="flex-1 text-left">{{ item.label }}</span>
          <span class="rounded bg-slate-800/60 px-1.5 py-0.5 text-[10px] tracking-wide text-slate-500 uppercase"
            >Soon</span
          >
        </button>
      }
    }
  </nav>

  <div class="mt-2 space-y-0.5 border-t border-slate-800/70 px-2 pt-2">
    <button
      type="button"
      disabled
      class="flex w-full cursor-not-allowed items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600"
    >
      <app-icon [name]="settingsItem.icon" class="h-[18px] w-[18px]" />
      <span class="flex-1 text-left">{{ settingsItem.label }}</span>
      <span class="rounded bg-slate-800/60 px-1.5 py-0.5 text-[10px] tracking-wide text-slate-500 uppercase"
        >Soon</span
      >
    </button>
  </div>

  <div class="mt-3 flex items-center gap-2.5 border-t border-slate-800/70 px-2 pt-3">
    <div
      class="flex h-8 w-8 items-center justify-center rounded-full bg-indigo-500/20 text-sm font-semibold text-indigo-300"
    >
      M
    </div>
    <div class="min-w-0">
      <p class="truncate text-sm font-medium text-slate-100">Mahomies in Paris</p>
      <p class="truncate text-xs text-slate-500">Season 2024 &middot; Week 14</p>
    </div>
  </div>
</aside>
